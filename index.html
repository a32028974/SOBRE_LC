<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>v1 Sobre Clientes</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="print.css" media="print">
</head>
<body>

<div class="controls">
  <input id="num" placeholder="Número">
  <input id="ape" placeholder="Apellido">
  <input id="nom" placeholder="Nombre">
  <button onclick="update()">Actualizar</button>
  <button onclick="window.print()">Imprimir</button>
</div>

<div class="page">
  <div class="rotated">
    <div class="row">
      <div class="box num"><span id="vNum">0000</span></div>
      <div class="col">
        <div class="box txt"><span id="vApe">APELLIDO</span></div>
        <div class="box txt"><span id="vNom">NOMBRE</span></div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
