<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sobre LC Clientes • Imprimir</title>

  <style>
    :root{
      /* Hoja */
      --page-w: 210mm;  /* A4 */
      --page-h: 297mm;

      /* Offset (posición) */
      --off-x: 12mm;
      --off-y: 32mm;

      /* Rotación FIJA */
      --rot: 90deg;

      /* Cajas fijas exactas */
      --num-w: 48mm; --num-h: 15mm;
      --txt-w: 75mm; --txt-h: 15mm;

      /* Separaciones */
      --gap-x: 10mm;
      --gap-y: 2mm;

      /* Tamaños máximos (se achica si no entra) */
      --max-num: 72pt;
      --max-ape: 64pt;
      --max-nom: 56pt;

      /* Fuente */
      --font: "Calibri", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: var(--font);
      background:#0b0f14;
      color:#e8eef7;
    }
    .app{
      max-width: 1150px;
      margin: 16px auto;
      padding: 14px;
    }

    .panel{
      background:#111826;
      border:1px solid #243044;
      border-radius: 12px;
      padding: 12px;
      display:flex;
      gap:12px;
      flex-wrap: wrap;
      align-items:flex-end;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width: 190px;
    }
    label{ font-size:12px; opacity:.9; }

    input{
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #2b3a52;
      background:#0f1622;
      color:#e8eef7;
      outline:none;
      font-size:16px;
    }
    input:focus{ border-color:#4c84ff; }

    .btns{ display:flex; gap:10px; flex-wrap:wrap; }
    button{
      cursor:pointer;
      border:0;
      border-radius:10px;
      padding:10px 14px;
      font-weight:800;
      font-size:14px;
    }
    .b1{ background:#4c84ff; color:#08101c; }
    .b2{ background:#22c55e; color:#06120a; }
    .b3{ background:#f97316; color:#1a0b02; }
    .b4{ background:#334155; color:#e8eef7; }

    .small{
      opacity:.9;
      font-size:12px;
      margin-top:8px;
      line-height:1.35;
    }

    /* ===== Preview ===== */
    .preview-wrap{
      margin-top: 14px;
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      align-items:flex-start;
    }

    .page-preview{
      width: 520px;
      aspect-ratio: 210 / 297;
      background:#fff;
      border-radius: 10px;
      border: 1px solid #2b3a52;
      position: relative;
      overflow:hidden;
    }

    /* grupo “como imprime”, pero en preview */
    .pv-group{
      position:absolute;
      left: calc(var(--off-x) * (520 / 210));
      top:  calc(var(--off-y) * (520 / 210));
      transform-origin: top left;

      /* importante: para 90°, compenso para que no se vaya a X negativo */
      transform:
        translate(calc((var(--txt-h) + var(--gap-y) + var(--txt-h)) * (520 / 210)), 0)
        rotate(var(--rot));
    }

    .pv-row{ display:flex; gap: calc(var(--gap-x) * (520/210)); align-items:center; }
    .pv-col{ display:flex; flex-direction:column; gap: calc(var(--gap-y) * (520/210)); }

    .pv-box{
      outline: 2px dashed rgba(76,132,255,.7);
      outline-offset: -2px;
      background: rgba(76,132,255,.06);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
      color:#000;
    }
    .pv-num{ width: calc(var(--num-w)*(520/210)); height: calc(var(--num-h)*(520/210)); }
    .pv-txt{ width: calc(var(--txt-w)*(520/210)); height: calc(var(--txt-h)*(520/210)); }

    .tools{
      flex: 1;
      min-width: 330px;
      background:#0f1622;
      border:1px solid #243044;
      border-radius: 12px;
      padding: 12px;
    }
    .tools h3{ margin:0 0 8px 0; font-size:14px; opacity:.95; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .row .field{ min-width: 140px; }

    /* ===== ZONA DE IMPRESIÓN (SIEMPRE EXISTE) =====
       En pantalla: fuera de vista + invisible (pero con tamaño real, para medir bien).
       En print: aparece en 0,0 y se ve.
    */
    .print-stage{
      position: fixed;
      left: -10000px; top: 0;
      width: var(--page-w);
      height: var(--page-h);
      background:#fff;
      visibility: hidden;
      overflow: hidden;
    }

    @page{ size: A4; margin: 0; }

    @media print{
  body{
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .fit{
    color: #000 !important;
    opacity: 1 !important;
    -webkit-text-fill-color: #000 !important;
  }
}


    /* grupo real */
    .print-group{
      position:absolute;
      left:0; top:0;
      transform-origin: top left;

      /* mismo truco: translate(altura del grupo) antes del rotate(90) */
      transform:
        translate(var(--off-x), var(--off-y))
        translate(calc(var(--txt-h) + var(--gap-y) + var(--txt-h)), 0)
        rotate(var(--rot));
    }

    .print-row{ display:flex; gap: var(--gap-x); align-items:center; }
    .print-col{ display:flex; flex-direction:column; gap: var(--gap-y); }

    .box{
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
      margin:0;
    }
    .box-num{ width:var(--num-w); height:var(--num-h); }
    .box-txt{ width:var(--txt-w); height:var(--txt-h); }

    /* texto */
    .fit{
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1;
      white-space: nowrap;
      display:block;
      transform-origin:center;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="panel">
      <div class="field">
        <label>Número v10 (4 a 6 dígitos / puede tener /1)</label>
        <input id="num" placeholder="Ej: 7912/2" />
      </div>

      <div class="field" style="min-width:260px">
        <label>Apellido</label>
        <input id="ape" placeholder="Ej: ROMERO MICHAELIS" />
      </div>

      <div class="field" style="min-width:260px">
        <label>Nombre (1 o 2)</label>
        <input id="nom" placeholder="Ej: VERONICA ELIANA" />
      </div>

      <div class="btns">
        <button class="b1" id="btnNext">Siguiente Nº</button>
        <button class="b4" id="btnUpdate">Actualizar vista</button>
        <button class="b2" id="btnPrint">Imprimir</button>
        <button class="b3" id="btnReset">Reset offsets</button>
      </div>

      <div class="small">
        ✅ 90° fijo permanente. Cajas fijas: Nº 48×15mm • Apellido 75×15mm • Nombre 75×15mm.<br>
        ✅ Auto-fit ancho/alto: nunca recorta.<br>
        🖨️ Recomendado: A4 • Scale 100% • Margins: None • sin headers/footers.
      </div>
    </div>

    <div class="preview-wrap">
      <div class="page-preview">
        <div class="pv-group">
          <div class="pv-row">
            <div class="pv-box pv-num"><span class="fit" id="pvNum">—</span></div>
            <div class="pv-col">
              <div class="pv-box pv-txt"><span class="fit" id="pvApe">APELLIDO</span></div>
              <div class="pv-box pv-txt"><span class="fit" id="pvNom">NOMBRE</span></div>
            </div>
          </div>
        </div>
      </div>

      <div class="tools">
        <h3>Ajuste fino</h3>

        <div class="row">
          <div class="field">
            <label>Offset X (mm)</label>
            <input id="offx" inputmode="decimal" />
          </div>
          <div class="field">
            <label>Offset Y (mm)</label>
            <input id="offy" inputmode="decimal" />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>Máx letra Nº (pt)</label>
            <input id="maxNum" inputmode="decimal" />
          </div>
          <div class="field">
            <label>Máx letra Apellido (pt)</label>
            <input id="maxApe" inputmode="decimal" />
          </div>
          <div class="field">
            <label>Máx letra Nombre (pt)</label>
            <input id="maxNom" inputmode="decimal" />
          </div>
        </div>

        <button class="b4" id="btnSave">Guardar</button>
        <div class="small" style="margin-top:10px">Tip: si “se va de lugar”, solo tocás Offset X/Y.</div>
      </div>
    </div>
  </div>

  <!-- ZONA DE IMPRESIÓN (siempre existe) -->
  <div class="print-stage" aria-hidden="true">
    <div class="print-group">
      <div class="print-row">
        <div class="box box-num"><span class="fit" id="prNum">—</span></div>
        <div class="print-col">
          <div class="box box-txt"><span class="fit" id="prApe">APELLIDO</span></div>
          <div class="box box-txt"><span class="fit" id="prNom">NOMBRE</span></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const KEY = "sobre_lc_clientes_v10";

  const defaults = {
    num: "7912/2",
    offx: 12,
    offy: 32,
    maxNum: 72,
    maxApe: 64,
    maxNom: 56
  };

  function loadState(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch{ return {}; } }
  function saveState(p){ const st=loadState(); const nx={...st,...p}; localStorage.setItem(KEY, JSON.stringify(nx)); return nx; }
  function toUpperSafe(s){ return (s??"").toString().trim().toUpperCase(); }
  function setVar(name, v, unit){ document.documentElement.style.setProperty(name, v + unit); }

  // Auto-fit: máximo -> achica hasta entrar por ancho o por alto
  function fitToBox(span, maxPt, minPt){
    const box = span.parentElement;
    if(!box) return;

    let pt = maxPt;
    span.style.fontSize = pt + "pt";
    span.style.transform = "scale(1)";

    // Forzar layout
    span.getBoundingClientRect();

    const bw = box.clientWidth;
    const bh = box.clientHeight;

    // Si caja no tiene tamaño (no debería pasar con print-stage fuera de pantalla)
    if(bw <= 0 || bh <= 0) return;

    // Bajamos hasta que entre
    while(pt > minPt && (span.scrollWidth > bw || span.scrollHeight > bh)){
      pt -= 1;
      span.style.fontSize = pt + "pt";
    }

    // Si todavía no entra (casos extremos), aplico escala fina
    span.getBoundingClientRect();
    const sw = span.scrollWidth || 1;
    const sh = span.scrollHeight || 1;

    const sx = bw / sw;
    const sy = bh / sh;
    const s = Math.min(1, sx, sy);

    if(s < 1){
      span.style.transform = `scale(${s})`;
    }
  }

  function refresh(){
    const num = toUpperSafe($("num").value) || "—";
    const ape = toUpperSafe($("ape").value) || "APELLIDO";
    const nom = toUpperSafe($("nom").value) || "NOMBRE";

    $("pvNum").textContent = num;
    $("pvApe").textContent = ape;
    $("pvNom").textContent = nom;

    $("prNum").textContent = num;
    $("prApe").textContent = ape;
    $("prNom").textContent = nom;

    const maxNum = parseFloat($("maxNum").value) || defaults.maxNum;
    const maxApe = parseFloat($("maxApe").value) || defaults.maxApe;
    const maxNom = parseFloat($("maxNom").value) || defaults.maxNom;

    // Ajustar preview
    fitToBox($("pvNum"), maxNum, 16);
    fitToBox($("pvApe"), maxApe, 14);
    fitToBox($("pvNom"), maxNom, 14);

    // Ajustar print
    fitToBox($("prNum"), maxNum, 16);
    fitToBox($("prApe"), maxApe, 14);
    fitToBox($("prNom"), maxNom, 14);
  }

  function nextNumber(){
    // Suma al primer bloque numérico, mantiene sufijo (/1, /2, etc)
    const raw = ($("num").value||"").toString().trim();
    const m = raw.match(/^(\d+)(.*)$/);
    const base = m ? parseInt(m[1],10) : NaN;
    const suf = m ? (m[2]||"") : "";
    const next = Number.isFinite(base) ? (base + 1) : parseInt(defaults.num,10);
    $("num").value = String(next) + suf;
    saveState({ num: $("num").value });
    refresh();
  }

  function saveAll(){
    const offx = parseFloat($("offx").value);
    const offy = parseFloat($("offy").value);
    if(Number.isFinite(offx)) setVar("--off-x", offx, "mm");
    if(Number.isFinite(offy)) setVar("--off-y", offy, "mm");

    const maxNum = parseFloat($("maxNum").value);
    const maxApe = parseFloat($("maxApe").value);
    const maxNom = parseFloat($("maxNom").value);

    saveState({
      num: $("num").value,
      offx: Number.isFinite(offx) ? offx : defaults.offx,
      offy: Number.isFinite(offy) ? offy : defaults.offy,
      maxNum: Number.isFinite(maxNum) ? maxNum : defaults.maxNum,
      maxApe: Number.isFinite(maxApe) ? maxApe : defaults.maxApe,
      maxNom: Number.isFinite(maxNom) ? maxNom : defaults.maxNom
    });

    refresh();
    alert("Guardado ✅");
  }

  function resetOffsets(){
    $("offx").value = defaults.offx;
    $("offy").value = defaults.offy;
    setVar("--off-x", defaults.offx, "mm");
    setVar("--off-y", defaults.offy, "mm");
    saveState({ offx: defaults.offx, offy: defaults.offy });
    refresh();
  }

  function init(){
    const st = { ...defaults, ...loadState() };

    $("num").value = st.num ?? defaults.num;
    $("ape").value = st.ape ?? "";
    $("nom").value = st.nom ?? "";

    $("offx").value = st.offx ?? defaults.offx;
    $("offy").value = st.offy ?? defaults.offy;

    $("maxNum").value = st.maxNum ?? defaults.maxNum;
    $("maxApe").value = st.maxApe ?? defaults.maxApe;
    $("maxNom").value = st.maxNom ?? defaults.maxNom;

    setVar("--off-x", (st.offx ?? defaults.offx), "mm");
    setVar("--off-y", (st.offy ?? defaults.offy), "mm");

    // primera pasada + otra en 1 frame (por fonts/layout)
    refresh();
    requestAnimationFrame(refresh);
  }

  // Importante: antes de imprimir, refresco sí o sí
  window.addEventListener("beforeprint", () => {
    refresh();
    // una vuelta más por si el driver reflowea
    requestAnimationFrame(refresh);
  });

  $("btnNext").addEventListener("click", nextNumber);
  $("btnUpdate").addEventListener("click", refresh);
  $("btnPrint").addEventListener("click", ()=>{ refresh(); window.print(); });
  $("btnReset").addEventListener("click", resetOffsets);
  $("btnSave").addEventListener("click", saveAll);

  ["num","ape","nom","offx","offy","maxNum","maxApe","maxNom"].forEach(id=>{
    $(id).addEventListener("input", ()=>{ if(["num","ape","nom"].includes(id)) refresh(); });
    $(id).addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); refresh(); }});
  });

  init();
</script>
</body>
</html>
