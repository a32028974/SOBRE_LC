<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sobre LC Clientes • Imprimir (V9 FIX)</title>

  <style>
    :root{
      --page-w: 210mm;  /* A4 */
      --page-h: 297mm;  /* A4 */

      /* posición del grupo en hoja */
      --off-x: 12mm;
      --off-y: 32mm;

      /* 90° FIJO */
      --rot: 90deg;

      /* cajas fijas exactas */
      --num-w: 48mm; --num-h: 15mm;
      --txt-w: 75mm; --txt-h: 15mm;

      --gap-x: 10mm;
      --gap-y: 2mm;

      /* dimensiones del grupo para compensar rotación */
      --group-w: calc(var(--num-w) + var(--gap-x) + var(--txt-w)); /* 133mm */
      --group-h: calc(var(--txt-h) + var(--gap-y) + var(--txt-h)); /* 32mm */

      /* límites visuales */
      --max-num-pt: 72;
      --max-ape-pt: 64;
      --max-nom-pt: 56;

      --font: "Calibri", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: var(--font);
      background:#0b0f14;
      color:#e8eef7;
    }
    .app{ max-width: 1150px; margin: 16px auto; padding: 14px; }

    .panel{
      background:#111826;
      border:1px solid #243044;
      border-radius: 12px;
      padding: 12px;
      display:flex;
      gap:12px;
      flex-wrap: wrap;
      align-items:flex-end;
    }
    .field{ display:flex; flex-direction:column; gap:6px; min-width: 180px; }
    label{ font-size:12px; opacity:.9; }
    input{
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #2b3a52;
      background:#0f1622;
      color:#e8eef7;
      outline:none;
      font-size:16px;
    }
    input:focus{ border-color:#4c84ff; }

    .btns{ display:flex; gap:10px; flex-wrap: wrap; }
    button{
      cursor:pointer; border:0; border-radius: 10px;
      padding: 10px 14px; font-weight: 800; font-size: 14px;
    }
    .b1{ background:#4c84ff; color:#08101c; }
    .b2{ background:#22c55e; color:#06120a; }
    .b3{ background:#f97316; color:#1a0b02; }
    .b4{ background:#334155; color:#e8eef7; }

    .small{ opacity:.9; font-size:12px; margin-top:8px; line-height:1.35; }

    /* preview */
    .preview-wrap{ margin-top: 14px; display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start; }
    .page-preview{
      width: 520px;
      aspect-ratio: 210 / 297;
      background:#fff;
      border-radius: 10px;
      border: 1px solid #2b3a52;
      position: relative;
      overflow:hidden;
    }
    .pv-group{
      position:absolute;
      left: calc(var(--off-x) * (520 / 210));
      top:  calc(var(--off-y) * (520 / 210));
      transform-origin: top left;
      transform:
        translate(calc(var(--group-h) * (520 / 210)), 0)
        rotate(var(--rot));
    }
    .pv-row{ display:flex; gap: calc(var(--gap-x) * (520/210)); align-items:center; }
    .pv-col{ display:flex; flex-direction:column; gap: calc(var(--gap-y) * (520/210)); }

    .pv-box{
      outline: 2px dashed rgba(76,132,255,.7);
      outline-offset: -2px;
      background: rgba(76,132,255,.06);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 0;
      color:#000;
    }
    .pv-num{ width: calc(var(--num-w)*(520/210)); height: calc(var(--num-h)*(520/210)); }
    .pv-txt{ width: calc(var(--txt-w)*(520/210)); height: calc(var(--txt-h)*(520/210)); }

    .tools{
      flex: 1;
      min-width: 330px;
      background:#0f1622;
      border:1px solid #243044;
      border-radius: 12px;
      padding: 12px;
    }
    .tools h3{ margin:0 0 8px 0; font-size:14px; opacity:.95; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 10px; }
    .row .field{ min-width: 140px; }

    /* impresión */
    @page{ size: A4; margin: 0; }

    @media print{
      body{ background:#fff; color:#000; }
      .app, .panel, .preview-wrap, .tools, .small { display:none !important; }
      .print-page{ display:block !important; }
    }
    .print-page{
      display:none;
      width: var(--page-w);
      height: var(--page-h);
      position: relative;
      background:#fff;
    }
    .print-group{
      position:absolute;
      left:0; top:0;
      transform-origin: top left;
      transform:
        translate(var(--off-x), var(--off-y))
        translate(var(--group-h), 0)
        rotate(var(--rot));
    }
    .print-row{ display:flex; gap: var(--gap-x); align-items:center; }
    .print-col{ display:flex; flex-direction:column; gap: var(--gap-y); }

    .box{ width:auto; height:auto; overflow:hidden; padding:0; margin:0; }
    .box-num{ width:var(--num-w); height:var(--num-h); }
    .box-txt{ width:var(--txt-w); height:var(--txt-h); }

    /* SVG dentro de caja: ocupa 100% */
    .fitSvg{ width:100%; height:100%; display:block; }
    .fitText{
      font-family: var(--font);
      font-weight: 900;
      letter-spacing: 1px;
      dominant-baseline: middle;  /* centra vertical */
      text-anchor: middle;        /* centra horizontal */
      fill: #000;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="panel">
      <div class="field">
        <label>Número (4 a 6 dígitos / puede tener /1)</label>
        <input id="num" placeholder="Ej: 7912/2" />
      </div>

      <div class="field" style="min-width:260px">
        <label>Apellido</label>
        <input id="ape" placeholder="Ej: ROMERO MICHAELIS" />
      </div>

      <div class="field" style="min-width:260px">
        <label>Nombre (1 o 2)</label>
        <input id="nom" placeholder="Ej: VERONICA ELIANA" />
      </div>

      <div class="btns">
        <button class="b1" id="btnNext">Siguiente Nº</button>
        <button class="b4" id="btnUpdate">Actualizar vista</button>
        <button class="b2" id="btnPrint">Imprimir</button>
        <button class="b3" id="btnReset">Reset offsets</button>
      </div>

      <div class="small">
        ✅ V9 FIX: auto-fit por SVG (no falla en impresión).<br>
        ✅ 90° fijo permanente. Cajas fijas: Nº 48×15mm • Apellido 75×15mm • Nombre 75×15mm.
      </div>
    </div>

    <div class="preview-wrap">
      <div class="page-preview">
        <div class="pv-group">
          <div class="pv-row">
            <div class="pv-box pv-num" id="pvBoxNum"></div>
            <div class="pv-col">
              <div class="pv-box pv-txt" id="pvBoxApe"></div>
              <div class="pv-box pv-txt" id="pvBoxNom"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="tools">
        <h3>Ajuste fino</h3>
        <div class="row">
          <div class="field">
            <label>Offset X (mm)</label>
            <input id="offx" inputmode="decimal" />
          </div>
          <div class="field">
            <label>Offset Y (mm)</label>
            <input id="offy" inputmode="decimal" />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>Máx letra Nº (pt)</label>
            <input id="maxNum" inputmode="decimal" />
          </div>
          <div class="field">
            <label>Máx letra Apellido (pt)</label>
            <input id="maxApe" inputmode="decimal" />
          </div>
          <div class="field">
            <label>Máx letra Nombre (pt)</label>
            <input id="maxNom" inputmode="decimal" />
          </div>
        </div>

        <button class="b4" id="btnSave">Guardar</button>
        <div class="small" style="margin-top:10px">Tip: tocá Offset X/Y para ubicarlo exacto.</div>
      </div>
    </div>
  </div>

  <!-- IMPRESIÓN REAL -->
  <div class="print-page">
    <div class="print-group">
      <div class="print-row">
        <div class="box box-num" id="prBoxNum"></div>
        <div class="print-col">
          <div class="box box-txt" id="prBoxApe"></div>
          <div class="box box-txt" id="prBoxNom"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const KEY = "sobre_lc_clientes_v9_svgfit";

  const defaults = {
    num: "7912/2",
    offx: 12,
    offy: 32,
    maxNum: 72,
    maxApe: 64,
    maxNom: 56
  };

  function loadState(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch{ return {}; } }
  function saveState(p){ const st=loadState(); const nx={...st,...p}; localStorage.setItem(KEY, JSON.stringify(nx)); return nx; }
  function toUpperSafe(s){ return (s??"").toString().trim().toUpperCase(); }
  function setVar(name, v, unit){ document.documentElement.style.setProperty(name, v + unit); }

  // crea un SVG dentro de una caja y ajusta el texto para que entre perfecto
  function renderFitText(container, text, maxPt){
    container.innerHTML = "";

    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "fitSvg");
    svg.setAttribute("viewBox", "0 0 1000 200");
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

    const t = document.createElementNS(svgNS, "text");
    t.setAttribute("class", "fitText");
    t.setAttribute("x", "500");
    t.setAttribute("y", "100");
    t.textContent = text;

    // tamaño base (alto grande) y luego escalamos
    t.style.fontSize = maxPt + "pt";

    svg.appendChild(t);
    container.appendChild(svg);

    // Esperar a layout para medir bbox
    const bbox = t.getBBox();

    // caja destino real (pixeles)
    const W = container.clientWidth;
    const H = container.clientHeight;

    // bbox en unidades SVG (viewBox). Pasamos a proporción
    // viewBox = 1000 x 200
    const scaleToPxX = W / 1000;
    const scaleToPxY = H / 200;

    // bbox traducido a px aprox
    const bw = bbox.width * scaleToPxX;
    const bh = bbox.height * scaleToPxY;

    // escala necesaria para entrar en W/H (la más chica manda)
    const sx = W / (bw || 1);
    const sy = H / (bh || 1);
    const s = Math.min(sx, sy);

    // Aplicar escala al TEXT (no al SVG) para mantener centrado
    t.setAttribute("transform", `translate(500 100) scale(${s}) translate(-500 -100)`);

    // color en preview/print
    t.setAttribute("fill", "#000");
  }

  function refresh(){
    const num = toUpperSafe($("num").value) || "—";
    const ape = toUpperSafe($("ape").value) || "APELLIDO";
    const nom = toUpperSafe($("nom").value) || "NOMBRE";

    const maxNum = parseFloat($("maxNum").value) || defaults.maxNum;
    const maxApe = parseFloat($("maxApe").value) || defaults.maxApe;
    const maxNom = parseFloat($("maxNom").value) || defaults.maxNom;

    // preview
    renderFitText($("pvBoxNum"), num, maxNum);
    renderFitText($("pvBoxApe"), ape, maxApe);
    renderFitText($("pvBoxNom"), nom, maxNom);

    // print
    renderFitText($("prBoxNum"), num, maxNum);
    renderFitText($("prBoxApe"), ape, maxApe);
    renderFitText($("prBoxNom"), nom, maxNom);
  }

  function nextNumber(){
    const raw = ($("num").value||"").toString().trim();
    const m = raw.match(/^(\d+)(.*)$/);
    const base = m ? parseInt(m[1],10) : NaN;
    const suf = m ? (m[2]||"") : "";
    const next = Number.isFinite(base) ? (base+1) : parseInt(defaults.num,10);
    $("num").value = String(next) + suf;
    saveState({ num: $("num").value });
    refresh();
  }

  function saveAll(){
    const offx = parseFloat($("offx").value);
    const offy = parseFloat($("offy").value);

    if(Number.isFinite(offx)) setVar("--off-x", offx, "mm");
    if(Number.isFinite(offy)) setVar("--off-y", offy, "mm");

    const maxNum = parseFloat($("maxNum").value);
    const maxApe = parseFloat($("maxApe").value);
    const maxNom = parseFloat($("maxNom").value);

    saveState({
      num: $("num").value,
      offx: Number.isFinite(offx) ? offx : defaults.offx,
      offy: Number.isFinite(offy) ? offy : defaults.offy,
      maxNum: Number.isFinite(maxNum) ? maxNum : defaults.maxNum,
      maxApe: Number.isFinite(maxApe) ? maxApe : defaults.maxApe,
      maxNom: Number.isFinite(maxNom) ? maxNom : defaults.maxNom
    });

    refresh();
    alert("Guardado ✅");
  }

  function resetOffsets(){
    $("offx").value = defaults.offx;
    $("offy").value = defaults.offy;
    setVar("--off-x", defaults.offx, "mm");
    setVar("--off-y", defaults.offy, "mm");
    saveState({ offx: defaults.offx, offy: defaults.offy });
    refresh();
  }

  function init(){
    const st = { ...defaults, ...loadState() };

    $("num").value = st.num ?? defaults.num;
    $("ape").value = st.ape ?? "";
    $("nom").value = st.nom ?? "";

    $("offx").value = st.offx ?? defaults.offx;
    $("offy").value = st.offy ?? defaults.offy;

    $("maxNum").value = st.maxNum ?? defaults.maxNum;
    $("maxApe").value = st.maxApe ?? defaults.maxApe;
    $("maxNom").value = st.maxNom ?? defaults.maxNom;

    setVar("--off-x", (st.offx ?? defaults.offx), "mm");
    setVar("--off-y", (st.offy ?? defaults.offy), "mm");

    refresh();
  }

  $("btnNext").addEventListener("click", nextNumber);
  $("btnUpdate").addEventListener("click", refresh);
  $("btnPrint").addEventListener("click", ()=>{ refresh(); window.print(); });
  $("btnReset").addEventListener("click", resetOffsets);
  $("btnSave").addEventListener("click", saveAll);

  ["num","ape","nom","offx","offy","maxNum","maxApe","maxNom"].forEach(id=>{
    $(id).addEventListener("input", ()=>{ if(["num","ape","nom"].includes(id)) refresh(); });
    $(id).addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); refresh(); }});
  });

  init();
</script>
</body>
</html>
